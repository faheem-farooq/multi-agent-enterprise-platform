services:
  backend:
    build: ./backend
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: sqlite:///./orchestrations.db
    volumes: ["./backend:/app"]
  frontend:
    build: ./frontend
    ports: ["3000:3000"]
    environment:
      NEXT_PUBLIC_WS_URL: ws://localhost:8000
    depends_on: [backend]
  redis:
    image: redis:7-alpine
    profiles: [redis]
    ports: ["6379:6379"]
